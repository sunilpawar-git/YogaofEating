name: ios-ci.yml
on:
  push:
    branches: [ main, development, feature/* ]
  pull_request:
    branches: [ main, development ]

jobs:
  # PHASE 1: Validate & Setup + Code Quality (Parallel)
  validate-setup:
    name: Validate & Setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate workflow structure
        run: |
          echo "✅ Repository structure validated"
          [ -d "Yoga of Eating.xcodeproj" ] && echo "✅ Xcode project found" || (echo "❌ Xcode project not found" && exit 1)
          [ -d "functions" ] && echo "✅ Firebase functions found" || (echo "❌ Firebase functions not found" && exit 1)
          echo "✅ Setup validation passed"

  swiftlint:
    name: SwiftLint
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: |
          brew install swiftlint
      - name: Run SwiftLint
        run: |
          swiftlint lint --reporter json > swiftlint-report.json || true
          if grep -q "error" swiftlint-report.json; then
            echo "⚠️  SwiftLint issues found"
          fi
          echo "✅ SwiftLint check completed"
      - name: Upload SwiftLint results
        uses: actions/upload-artifact@v4
        with:
          name: swiftlint-report
          path: swiftlint-report.json

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
          no-git: false
          exit-code: 1
          severity: high
        continue-on-error: true
      - name: Check for hardcoded secrets
        run: |
          echo "🔍 Scanning for hardcoded credentials..."
          ! git grep -E "(password|secret|api.?key|token)\s*=\s*['\"][^'\"]{8,}['\"]" -- ':!*.md' ':!.github/**' || echo "⚠️  Review required"
          echo "✅ Security check passed"

  # PHASE 2: Architecture Quality + Build & Test (Sequential with dependencies)
  architecture-quality:
    name: Architecture Quality
    runs-on: macos-latest
    timeout-minutes: 15
    needs: [validate-setup]
    steps:
      - uses: actions/checkout@v4
      - name: Check Swift code metrics
        run: |
          echo "📊 Analyzing code architecture..."
          xcodebuild -scheme "Yoga of Eating" -destination generic/platform=iOS build 2>&1 | grep -i "warning\|error" | head -20 || true
          echo "✅ Architecture analysis completed"
      - name: Validate build configuration
        run: |
          echo "🔍 Validating Xcode configuration..."
          [ -f "Yoga of Eating.xcodeproj/project.pbxproj" ] && echo "✅ Build config valid" || exit 1

  build-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 45
    needs: [validate-setup, swiftlint, security-check, architecture-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Create Firebase Config (CI Placeholder)
        run: |
          echo "📝 Creating Firebase placeholder config for CI..."
          cat > GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CLIENT_ID</key>
              <string>ci-test-client-id</string>
              <key>REVERSED_CLIENT_ID</key>
              <string>com.yogaofeating.yoga-of-eating-ci</string>
              <key>API_KEY</key>
              <string>ci-test-api-key</string>
              <key>GCM_SENDER_ID</key>
              <string>123456789</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.yogaofeating.Yoga-of-Eating</string>
              <key>PROJECT_ID</key>
              <string>yoga-of-eating-ci</string>
              <key>STORAGE_BUCKET</key>
              <string>yoga-of-eating-ci.appspot.com</string>
              <key>IS_ADS_ENABLED</key>
              <false/>
              <key>IS_ANALYTICS_ENABLED</key>
              <false/>
              <key>IS_APPINVITE_ENABLED</key>
              <true/>
              <key>IS_GCM_ENABLED</key>
              <true/>
              <key>IS_SIGNIN_ENABLED</key>
              <true/>
              <key>GOOGLE_APP_ID</key>
              <string>1:123456789:ios:abcdef123456</string>
              <key>DATABASE_URL</key>
              <string>https://yoga-of-eating-ci.firebaseio.com</string>
          </dict>
          </plist>
          EOF
          echo "✅ Firebase config created for CI"

      - name: Show Xcode version
        run: |
          echo "Xcode version:"
          xcodebuild -version

      - name: Show Swift version
        run: |
          echo "Swift version:"
          swift --version

      - name: Cache Build Artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData
            .build
          key: ${{ runner.os }}-build-${{ github.ref }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ github.ref }}-
            ${{ runner.os }}-build-main-

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "Yoga of Eating.xcodeproj" \
            -scheme "Yoga of Eating"

      - name: Get available iOS simulator
        id: simulator
        run: |
          echo "🔍 Detecting iOS simulator..."
          PREFERRED_SIMULATOR="iPhone 17 Pro"
          PREFERRED_OS="26.2"

          if xcrun simctl list devices available | grep -qiE "$PREFERRED_SIMULATOR.*26\.2|26\.2.*$PREFERRED_SIMULATOR"; then
            FOUND_SIMULATOR="$PREFERRED_SIMULATOR"
            FOUND_OS="$PREFERRED_OS"
          else
            IPHONE_17_PRO_LINE=$(xcrun simctl list devices available | grep -i "iPhone 17 Pro" | head -1)
            if [ -n "$IPHONE_17_PRO_LINE" ]; then
              EXTRACTED_OS=$(echo "$IPHONE_17_PRO_LINE" | grep -oE "iOS [0-9]+\.[0-9]+" | head -1 | sed 's/iOS //')
              if [ -n "$EXTRACTED_OS" ]; then
                FOUND_SIMULATOR="$PREFERRED_SIMULATOR"
                FOUND_OS="$EXTRACTED_OS"
              fi
            fi

            if [ -z "$FOUND_SIMULATOR" ]; then
              ALTERNATIVES=("iPhone 17" "iPhone 16 Pro" "iPhone 16" "iPhone 15 Pro" "iPhone 15" "iPhone 14")
              for sim in "${ALTERNATIVES[@]}"; do
                SIM_LINE=$(xcrun simctl list devices available | grep -i "$sim" | head -1)
                if [ -n "$SIM_LINE" ]; then
                  FOUND_SIMULATOR=$(echo "$SIM_LINE" | awk -F'(' '{print $1}' | xargs)
                  EXTRACTED_OS=$(echo "$SIM_LINE" | grep -oE "iOS [0-9]+\.[0-9]+" | head -1 | sed 's/iOS //')
                  [ -n "$EXTRACTED_OS" ] && FOUND_OS="$EXTRACTED_OS" || FOUND_OS=""
                  break
                fi
              done
            fi
          fi

          if [ -z "$FOUND_SIMULATOR" ]; then
            echo "❌ ERROR: No iPhone simulator found!"
            exit 1
          fi

          echo "simulator_name=$FOUND_SIMULATOR" >> $GITHUB_OUTPUT
          [ -n "$FOUND_OS" ] && echo "simulator_os=$FOUND_OS" >> $GITHUB_OUTPUT
          echo "✅ Selected: $FOUND_SIMULATOR ${FOUND_OS:+with iOS $FOUND_OS}"

      - name: Boot Simulator
        run: |
          SIMULATOR_NAME="${{ steps.simulator.outputs.simulator_name }}"
          [ -n "$SIMULATOR_NAME" ] && xcrun simctl boot "$SIMULATOR_NAME" 2>/dev/null || true

      - name: Build and Test iOS App
        run: |
          SIMULATOR_NAME="${{ steps.simulator.outputs.simulator_name }}"
          SIMULATOR_OS="${{ steps.simulator.outputs.simulator_os }}"

          if [ -n "$SIMULATOR_OS" ] && [ "$SIMULATOR_OS" != "" ]; then
            DESTINATION="platform=iOS Simulator,name=$SIMULATOR_NAME,OS=$SIMULATOR_OS"
          else
            DESTINATION="platform=iOS Simulator,name=$SIMULATOR_NAME"
          fi

          echo "🔨 Building with destination: $DESTINATION"

          xcodebuild clean test \
            -project "Yoga of Eating.xcodeproj" \
            -scheme "Yoga of Eating" \
            -destination "$DESTINATION" \
            -only-testing:"Yoga of EatingTests" \
            -configuration Debug \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          retention-days: 7

  firebase-functions-tests:
    name: Firebase Functions Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-setup]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        working-directory: ./functions
        run: npm ci

      - name: Run linting
        working-directory: ./functions
        continue-on-error: true
        run: |
          if grep -q "\"lint\"" package.json; then
            npm run lint
          else
            echo "✅ No lint script found"
          fi

      - name: Run tests
        working-directory: ./functions
        continue-on-error: true
        run: |
          if grep -q "\"test\"" package.json; then
            npm test
          else
            echo "✅ No test script found"
          fi

      - name: Verify functions can be loaded
        working-directory: ./functions
        continue-on-error: true
        run: node -e "require('./index.js'); console.log('✅ Functions loaded successfully')"

  # PHASE 3: CI Status Aggregation
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [validate-setup, swiftlint, security-check, architecture-quality, build-test, firebase-functions-tests]
    if: always()
    steps:
      - name: Aggregate CI Status
        run: |
          echo "🎯 CI Status Report"
          echo "==================="
          echo "✅ Validate & Setup: ${{ needs.validate-setup.result }}"
          echo "✅ SwiftLint: ${{ needs.swiftlint.result }}"
          echo "✅ Security Check: ${{ needs.security-check.result }}"
          echo "✅ Architecture Quality: ${{ needs.architecture-quality.result }}"
          echo "✅ Build & Test: ${{ needs.build-test.result }}"
          echo "✅ Firebase Functions: ${{ needs.firebase-functions-tests.result }}"
          echo ""

          if [ "${{ needs.build-test.result }}" == "success" ] && [ "${{ needs.firebase-functions-tests.result }}" == "success" ]; then
            echo "🎉 All CI checks PASSED!"
            exit 0
          else
            echo "❌ Some CI checks failed - review logs above"
            exit 1
          fi
